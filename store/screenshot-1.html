<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_shared.css"><link rel="stylesheet" href="../content/content.css">
<style>
body { width: 1280px; height: 800px; background: radial-gradient(90% 120% at 0% 0%, #2a1a6e 0%, #120d2b 55%, #0b0a14 100%);
  display: grid; grid-template-columns: 500px 1fr; align-items: center; padding: 0 72px; gap: 48px; }
.copy h1 { font-size: 52px; line-height: 1.08; font-weight: 800; letter-spacing: -0.025em; color: #fff; }
.copy h1 span { color: #b3a1ff; }
.copy ul { list-style: none; margin-top: 34px; display: grid; gap: 18px; }
.copy li { display: flex; gap: 14px; align-items: flex-start; font-size: 20px; line-height: 1.4; color: #d9d4f5; }
.copy li b { color: #fff; font-weight: 700; }
.dot { flex: none; width: 26px; height: 26px; border-radius: 8px; margin-top: 1px; }
.dot svg { width: 16px; height: 16px; }
.stage { display: flex; justify-content: center; }
/* Show the real preview panel statically */
.xrp-preview { animation: none; width: 470px; }
.xrp-preview-media { height: 300px; }
.xrp-preview-media .scene { width: 100%; height: 100%; }
</style></head><body>
<div class="copy">
  <h1>Repost media<br><span>in one click</span></h1>
  <ul>
    <li><span class="glyph dot"><svg viewBox="0 0 24 24" stroke-width="2.6"><path d="M5 12l4 4 10-10"/></svg></span><span><b>Photos, videos &amp; GIFs</b>: fetched at original quality</span></li>
    <li><span class="glyph dot"><svg viewBox="0 0 24 24" stroke-width="2.6"><path d="M5 12l4 4 10-10"/></svg></span><span><b>Preview &amp; edit</b> the caption before anything happens</span></li>
    <li><span class="glyph dot"><svg viewBox="0 0 24 24" stroke-width="2.6"><path d="M5 12l4 4 10-10"/></svg></span><span><b>Credits the creator</b> with “via @handle” by default</span></li>
    <li><span class="glyph dot"><svg viewBox="0 0 24 24" stroke-width="2.6"><path d="M5 12l4 4 10-10"/></svg></span><span><b>You click Post</b>: nothing is ever posted for you</span></li>
  </ul>
</div>
<div class="stage">
  <div class="xrp-preview" role="dialog">
    <div class="xrp-preview-header">
      <svg class="xrp-preview-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="3"/><path d="M10 14 20 4M13.5 4H20v6.5"/></svg>
      <h3>Confirm RePost</h3>
      <button class="xrp-close-btn">✕</button>
    </div>
    <div class="xrp-preview-media"><div class="scene"></div><span class="xrp-preview-media-badge">video</span></div>
    <div class="xrp-preview-caption">
      <label class="xrp-caption-label">Caption <span class="xrp-char-count">64/280</span></label>
      <textarea class="xrp-caption-input">Golden hour over the lake tonight 🌅

via @sample_creator</textarea>
      <label class="xrp-credit"><input type="checkbox" checked><span>Credit the original author (adds "via @sample_creator")</span></label>
    </div>
    <div class="xrp-preview-actions">
      <button class="xrp-btn-cancel">Cancel</button>
      <button class="xrp-btn-confirm">↩ RePost</button>
    </div>
  </div>
</div>
</body></html>
